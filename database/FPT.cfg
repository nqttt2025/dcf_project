[dcf]
# DCF Model Parameters
# yr: Number of years to forecast (years)
yr = 5

# dr: Discount Rate (%) - Expected return rate for investors
# Higher rate = more risky stock, lower valuation
# Typical range: 8-15% depending on company risk
dr = 10

# pr: Perpetual/Terminal Growth Rate (%) - Expected growth after forecast period
# Usually equals long-term inflation rate
# Typical range: 2-3%
pr = 2.5

[graham]
# Graham Number Parameters
# These are constants from "The Intelligent Investor" by Benjamin Graham
# Formula: EPS × (8.5 + 2 × Growth Rate)

# Base PE multiple
base_pe = 8.5

# Growth multiplier
growth_multiplier = 2

[ticker]
# Stock ticker to analyze
ticker = FPT

[data_source]
# Source for stock data
# Options: VCI (default), other sources supported by vnstock
source = VCI
