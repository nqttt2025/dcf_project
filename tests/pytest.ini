[pytest]
# Pytest configuration for DCF Project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (requires Docker services)
    e2e: End-to-end tests (slow, full stack)
    slow: Slow running tests

# Default options
addopts = -v --tb=short

# Async mode
asyncio_mode = auto

# Coverage
# Run with: pytest --cov=src --cov-report=html

# Timeout (fail tests that take too long)
timeout = 30

# Logging
log_cli = true
log_cli_level = INFO

