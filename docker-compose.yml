version: '3.8'

# Docker Compose file with versioning support
# Version is set via VERSION environment variable or defaults to 'latest'
# Usage: VERSION=v1.0.0 docker-compose build
# 
# Build optimizations:
# - BuildKit enabled for faster builds
# - Base image caching for common dependencies
# - Parallel builds for multiple services

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: dcf-postgres
    environment:
      - POSTGRES_USER=dcf_user
      - POSTGRES_PASSWORD=dcf_password
      - POSTGRES_DB=dcf_db
    ports:
      - "5433:5432"  # Changed host port to 5433 to avoid conflict with host PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/architecture/database/database-migration.sql:/docker-entrypoint-initdb.d/01-migration.sql
      - ./docs/architecture/database/database-improvements.sql:/docker-entrypoint-initdb.d/02-improvements.sql
    networks:
      - dcf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcf_user -d dcf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: dcf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dcf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Base image with common dependencies (built first, cached for other services)
  base:
    build:
      context: .
      dockerfile: services/common/Dockerfile.base
      args:
        - BASE_VERSION=${BASE_VERSION:-latest}
    image: dcf-project-base:${BASE_VERSION:-latest}
    # Don't start this service, it's just a base image
    profiles:
      - build-only

  # API Gateway - Routes requests to microservices
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile.gateway
      args:
        - BASE_VERSION=${BASE_VERSION:-latest}
        - VERSION=${VERSION:-latest}
    image: dcf-project-gateway:${VERSION:-latest}
    container_name: dcf-gateway
    ports:
      - "8000:8000"
    environment:
      - DCF_SERVICE_URL=http://dcf:8001
      - STOCK_SERVICE_URL=http://stock:8002
      - DATABASE_SERVICE_URL=http://database:8003
      - DATABASE_URL=postgresql://dcf_user:dcf_password@postgres:5432/dcf_db
      - REDIS_URL=redis://redis:6379/0
      - APP_VERSION=${VERSION:-latest}
    depends_on:
      - redis
      - postgres
      - dcf
      - stock
      - database
    volumes:
      - ./config/ssl:/app/ssl:ro
    networks:
      - dcf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://localhost:8000/health', verify=False)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # DCF Service - Handles DCF analysis
  dcf:
    build:
      context: .
      dockerfile: services/dcf/Dockerfile.dcf
      args:
        - BASE_VERSION=${BASE_VERSION:-latest}
        - VERSION=${VERSION:-latest}
    image: dcf-project-dcf:${VERSION:-latest}
    container_name: dcf-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://dcf_user:dcf_password@postgres:5432/dcf_db
      - APP_VERSION=${VERSION:-latest}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - dcf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Stock Service - Manages stock data
  stock:
    build:
      context: .
      dockerfile: services/stock/Dockerfile.stock
      args:
        - BASE_VERSION=${BASE_VERSION:-latest}
        - VERSION=${VERSION:-latest}
    image: dcf-project-stock:${VERSION:-latest}
    container_name: dcf-stock
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://dcf_user:dcf_password@postgres:5432/dcf_db
      - APP_VERSION=${VERSION:-latest}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - dcf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database Service - Manages database operations and sync
  database:
    build:
      context: .
      dockerfile: services/database/Dockerfile.database
      args:
        - BASE_VERSION=${BASE_VERSION:-latest}
        - VERSION=${VERSION:-latest}
    image: dcf-project-database:${VERSION:-latest}
    container_name: dcf-database
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://dcf_user:dcf_password@postgres:5432/dcf_db
      - REDIS_URL=redis://redis:6379/0
      - APP_VERSION=${VERSION:-latest}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - dcf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Service - Nginx serving static files
  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile.frontend
      args:
        - VERSION=${VERSION:-latest}
    image: dcf-project-frontend:${VERSION:-latest}
    container_name: dcf-frontend
    ports:
      - "8081:80"
      - "8082:80"
    depends_on:
      - gateway
    networks:
      - dcf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dcf-network:
    driver: bridge

volumes:
  dcf-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
