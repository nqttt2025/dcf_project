<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCF Project - System Monitoring & Health</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        /* Tab Navigation */
        .tabs {
            background: white;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 150px;
            padding: 12px 24px;
            background: #f3f4f6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Enhanced Header */
        .monitoring-header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .monitoring-header h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 2em;
        }

        .monitoring-header p {
            color: #666;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-links a:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }

        /* Controls */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6b7280;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auto-refresh input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .auto-refresh label {
            color: #333;
            font-weight: 500;
            cursor: pointer;
        }

        /* Summary Card */
        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .summary-item {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            background: #f9fafb;
        }

        .summary-item .value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .summary-item .label {
            color: #666;
            font-size: 0.9em;
        }

        .summary-item.healthy .value { color: #10b981; }
        .summary-item.unhealthy .value { color: #ef4444; }
        .summary-item.warning .value { color: #f59e0b; }

        /* Status Grid */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #e5e7eb;
            transition: background 0.3s;
        }

        .status-card.healthy::before { background: #10b981; }
        .status-card.unhealthy::before { background: #ef4444; }
        .status-card.warning::before { background: #f59e0b; }
        .status-card.unknown::before { background: #6b7280; }

        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }

        .status-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-card h2 {
            color: #333;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.healthy {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.unhealthy {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-badge.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .status-badge.unknown {
            background: #f3f4f6;
            color: #374151;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-indicator.healthy {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .status-indicator.unhealthy {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            animation: none;
        }

        .status-indicator.warning {
            background: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .status-indicator.unknown {
            background: #6b7280;
            animation: none;
        }

        .status-details {
            margin-top: 15px;
            font-size: 0.9em;
        }

        .status-details p {
            margin: 8px 0;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .status-details strong {
            color: #333;
        }

        .status-details .detail-value {
            color: #667eea;
            font-weight: 500;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .metric-item {
            text-align: center;
            padding: 10px;
            background: #f9fafb;
            border-radius: 6px;
        }

        .metric-item .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .metric-item .metric-label {
            font-size: 0.75em;
            color: #666;
            margin-top: 4px;
        }

        /* Architecture Diagram */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        #networkDiagram {
            width: 100%;
            height: 700px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        /* Requests List */
        .requests-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .request-item {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }

        .request-item:hover {
            background: #f9fafb;
        }

        .request-item:last-child {
            border-bottom: none;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .request-ticker {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .request-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .request-status.running {
            background: #dbeafe;
            color: #1e40af;
        }

        .request-status.processing {
            background: #fef3c7;
            color: #92400e;
        }

        .request-status.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .request-status.failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .request-progress {
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }

        .request-details {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .request-details p {
            margin: 3px 0;
        }

        /* Legend */
        #legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: #f9fafb;
            border-radius: 5px;
            font-size: 0.85em;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 2px solid rgba(0,0,0,0.2);
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .loading-spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #991b1b;
            padding: 15px;
            background: #fee2e2;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .timestamp {
            text-align: center;
            color: white;
            font-size: 0.9em;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .expandable-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .expand-toggle {
            background: #f3f4f6;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            color: #667eea;
            width: 100%;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .expand-toggle:hover {
            background: #e5e7eb;
        }

        .expand-content {
            margin-top: 10px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 6px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .expand-content.show {
            display: block;
        }

        .expand-content pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.85em;
            line-height: 1.5;
        }

        .copy-btn {
            background: #10b981;
            padding: 6px 12px;
            font-size: 0.8em;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            .status-grid {
                grid-template-columns: 1fr;
            }
            
            .monitoring-header {
                flex-direction: column;
                text-align: center;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="monitoring-header">
            <div>
                <h1>🔍 System Monitoring & Health</h1>
                <p>Real-time monitoring của kiến trúc microservices và health status</p>
            </div>
            <div class="nav-links">
                <a href="/">← Back to Stocks</a>
                <a href="/static/database.html">Database Monitor</a>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('overview')">
                <span>📊</span> Overview
            </button>
            <button class="tab-btn" onclick="switchTab('architecture')">
                <span>🏗️</span> Architecture
            </button>
            <button class="tab-btn" onclick="switchTab('health')">
                <span>🏥</span> Health Status
            </button>
        </div>

        <div class="controls">
            <div>
                <button class="btn" onclick="refreshData()" id="refreshBtn">
                    <span>🔄</span> Refresh
                </button>
                <button class="btn btn-secondary" onclick="exportData()">
                    <span>📥</span> Export JSON
                </button>
            </div>
            <div class="auto-refresh">
                    <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                    <label for="autoRefresh">Auto-refresh (10s)</label>
                </div>
            </div>

        <!-- Overview Tab -->
        <div id="overview-tab" class="tab-content active">
            <div id="summaryCard" class="summary-card" style="display: none;"></div>
            <div class="card" id="generalInfoCard" style="display: none; margin-bottom: 20px;">
                <h2>ℹ️ Thông tin chung</h2>
                <div id="generalInfoContent"></div>
            </div>
            <div class="status-grid" id="overviewStatusGrid" style="display: none;"></div>
        </div>

        <!-- Architecture Tab -->
        <div id="architecture-tab" class="tab-content">
            <div class="main-content">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 style="margin: 0;">📊 Architecture Diagram</h2>
                        <div id="legend" style="display: flex; gap: 15px; font-size: 0.85em; flex-wrap: wrap;"></div>
                    </div>
                    <div id="networkDiagram"></div>
                </div>
                <div class="card">
                    <h2>🔄 Active Requests</h2>
                    <div id="requestsList" class="requests-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">⏳</div>
                            <p>Không có request nào đang xử lý</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Health Status Tab -->
        <div id="health-tab" class="tab-content">
            <div id="healthSummaryCard" class="summary-card" style="display: none;"></div>
            <div class="status-grid" id="healthStatusGrid" style="display: none;"></div>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading data...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let network = null;
        let healthData = null;
        let responseTimes = {};
        let currentTab = 'overview';

        function switchTab(tabName) {
            currentTab = tabName;
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach((btn, index) => {
                btn.classList.remove('active');
                const tabNames = ['overview', 'architecture', 'health'];
                if (tabNames[index] === tabName) {
                    btn.classList.add('active');
                }
            });
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`${tabName}-tab`).classList.add('active');
            
            // Refresh data if needed
            if (tabName === 'architecture' && !network) {
                refreshData();
            }
        }

        async function refreshData() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const refreshBtn = document.getElementById('refreshBtn');
            const timestampEl = document.getElementById('timestamp');

            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            refreshBtn.disabled = true;

            try {
                // Get monitoring data
                let monitoringData = {};
                try {
                const monitoringResponse = await fetch('/api/monitoring');
                    monitoringData = await monitoringResponse.json();
                } catch (e) {
                    console.warn('Monitoring API not available, using default data');
                    monitoringData = getDefaultMonitoringData();
                }

                // Get health data
                const gatewayStart = performance.now();
                const gatewayResponse = await fetch('/api/health');
                const gatewayData = await gatewayResponse.json();
                responseTimes.gateway = Math.round(performance.now() - gatewayStart);

                let databaseData = null;
                try {
                    const dbStart = performance.now();
                    const dbResponse = await fetch('/api/database/health');
                    databaseData = await dbResponse.json();
                    responseTimes.database = Math.round(performance.now() - dbStart);
                } catch (e) {
                    console.warn('Database health check failed:', e);
                }

                healthData = {
                    gateway: gatewayData,
                    database: databaseData,
                    monitoring: monitoringData,
                    timestamp: new Date().toISOString(),
                    totalResponseTime: Math.round(performance.now() - gatewayStart)
                };

                // Update all tabs
                updateOverviewTab(gatewayData, monitoringData);
                updateArchitectureTab(monitoringData);
                updateHealthTab(gatewayData, databaseData);

                timestampEl.innerHTML = `
                    <strong>Last updated:</strong> ${new Date().toLocaleString('vi-VN')}<br>
                    <span style="font-size: 0.85em;">Total response time: ${healthData.totalResponseTime}ms</span>
                `;
            } catch (error) {
                errorEl.textContent = `Error loading data: ${error.message}`;
                errorEl.style.display = 'block';
                console.error('Data loading error:', error);
            } finally {
                loadingEl.style.display = 'none';
                refreshBtn.disabled = false;
            }
        }

        function updateOverviewTab(gatewayData, monitoringData) {
            // Summary
            const summaryCardEl = document.getElementById('summaryCard');
            const services = gatewayData.services || {};
            let healthyCount = 0;
            let unhealthyCount = 0;
            let warningCount = 0;
            const totalServices = Object.keys(services).length + 1;

            if (gatewayData.status === 'healthy') healthyCount++;
            else if (gatewayData.status === 'unhealthy') unhealthyCount++;
            else warningCount++;

            Object.values(services).forEach(service => {
                if (service.status === 'healthy') healthyCount++;
                else if (service.status === 'unhealthy') unhealthyCount++;
                else warningCount++;
            });

            const runningAnalyses = monitoringData.services?.dcf?.running_analyses || 0;

            summaryCardEl.innerHTML = `
                <div class="summary-item ${unhealthyCount > 0 ? 'unhealthy' : (warningCount > 0 ? 'warning' : 'healthy')}">
                    <div class="value">${totalServices}</div>
                    <div class="label">Total Services</div>
                </div>
                <div class="summary-item healthy">
                    <div class="value">${healthyCount}</div>
                    <div class="label">Healthy</div>
                </div>
                <div class="summary-item ${warningCount > 0 ? 'warning' : 'healthy'}">
                    <div class="value">${warningCount}</div>
                    <div class="label">Warning</div>
                </div>
                <div class="summary-item ${unhealthyCount > 0 ? 'unhealthy' : 'healthy'}">
                    <div class="value">${unhealthyCount}</div>
                    <div class="label">Unhealthy</div>
                </div>
                <div class="summary-item ${runningAnalyses > 0 ? 'warning' : 'healthy'}">
                    <div class="value">${runningAnalyses}</div>
                    <div class="label">Running Analyses</div>
                </div>
            `;
            summaryCardEl.style.display = 'grid';

            // General Information
            updateGeneralInfo(gatewayData, monitoringData, healthyCount, unhealthyCount, warningCount, totalServices);

            // Status Grid
            updateStatusGrid(gatewayData, document.getElementById('overviewStatusGrid'));
        }

        function updateGeneralInfo(gatewayData, monitoringData, healthyCount, unhealthyCount, warningCount, totalServices) {
            const generalInfoCard = document.getElementById('generalInfoCard');
            const generalInfoContent = document.getElementById('generalInfoContent');
            
            const gatewayInfo = gatewayData.service || 'gateway';
            const gatewayVersion = gatewayData.version || 'N/A';
            const gatewayTimestamp = gatewayData.timestamp ? new Date(gatewayData.timestamp).toLocaleString('vi-VN') : 'N/A';
            
            // Database info
            const dcfService = gatewayData.services?.dcf?.data || {};
            const dbInfo = dcfService.database_info || {};
            const dbName = dbInfo.database || 'N/A';
            const dbVersion = dbInfo.version || 'N/A';
            const dbConnected = dcfService.database === 'connected' || dbInfo.connected === true;
            const dbConnections = dbInfo.active_connections || 'N/A';
            
            // Redis info
            const redisStatus = dcfService.redis || 'N/A';
            const redisConnected = redisStatus === 'connected' || redisStatus === 'healthy';
            
            // System info
            const totalResponseTime = healthData?.totalResponseTime || responseTimes.gateway || 'N/A';
            const systemStatus = gatewayData.status || 'unknown';
            
            // Services info
            const services = gatewayData.services || {};
            const dcfStatus = services.dcf?.status || 'unknown';
            const stockStatus = services.stock?.status || 'unknown';
            const databaseStatus = services.database?.status || 'unknown';

        function updateHealthTab(gatewayData, databaseData) {
            displaySummary(gatewayData, document.getElementById('healthSummaryCard'));

        function displaySummary(gatewayData, summaryCardEl) {
            const services = gatewayData.services || {};
            let healthyCount = 0;
            let unhealthyCount = 0;
            let warningCount = 0;
            const totalServices = Object.keys(services).length + 1;

            if (gatewayData.status === 'healthy') healthyCount++;
            else if (gatewayData.status === 'unhealthy') unhealthyCount++;
            else warningCount++;

            Object.values(services).forEach(service => {
                if (service.status === 'healthy') healthyCount++;
                else if (service.status === 'unhealthy') unhealthyCount++;
                else warningCount++;
            });

            const overallStatus = unhealthyCount > 0 ? 'unhealthy' : (warningCount > 0 ? 'warning' : 'healthy');

            summaryCardEl.innerHTML = `
                <div class="summary-item ${overallStatus}">
                    <div class="value">${totalServices}</div>
                    <div class="label">Total Services</div>
                </div>
                <div class="summary-item healthy">
                    <div class="value">${healthyCount}</div>
                    <div class="label">Healthy</div>
                </div>
                <div class="summary-item ${warningCount > 0 ? 'warning' : 'healthy'}">
                    <div class="value">${warningCount}</div>
                    <div class="label">Warning</div>
                </div>
                <div class="summary-item ${unhealthyCount > 0 ? 'unhealthy' : 'healthy'}">
                    <div class="value">${unhealthyCount}</div>
                    <div class="label">Unhealthy</div>
                </div>
            `;
            summaryCardEl.style.display = 'grid';
        }

        function displayStatus(gatewayData, databaseData, statusGridEl) {
            statusGridEl.innerHTML = '';

            const gatewayCard = createServiceCard('Gateway', gatewayData, 'gateway');
            statusGridEl.appendChild(gatewayCard);

            const services = gatewayData.services || {};
            Object.entries(services).forEach(([name, service]) => {
                const serviceName = name.charAt(0).toUpperCase() + name.slice(1) + ' Service';
                const serviceData = service.data || service;
                const card = createServiceCard(serviceName, serviceData, name);
                statusGridEl.appendChild(card);
            });

            if (databaseData) {
                const dbCard = createDatabaseCard(databaseData);
                statusGridEl.appendChild(dbCard);
            }

            if (gatewayData.gateway_database) {
                const gatewayDbCard = createGatewayDatabaseCard(gatewayData.gateway_database);
                statusGridEl.appendChild(gatewayDbCard);
            }

            statusGridEl.style.display = 'grid';
        }

        function updateStatusGrid(gatewayData, gridEl) {
            const services = gatewayData.services || {};
            const statuses = [
                {
                    title: 'Gateway',
                    value: gatewayData.status || 'unknown',
                    status: gatewayData.status || 'unknown'
                },
                {
                    title: 'DCF Service',
                    value: services.dcf?.status || 'unknown',
                    status: services.dcf?.status || 'unknown'
                },
                {
                    title: 'Stock Service',
                    value: services.stock?.status || 'unknown',
                    status: services.stock?.status || 'unknown'
                },
                {
                    title: 'Database Service',
                    value: services.database?.status || 'unknown',
                    status: services.database?.status || 'unknown'
                }
            ];

            gridEl.innerHTML = statuses.map(s => `
                <div class="status-card ${s.status === 'healthy' ? 'healthy' : s.status === 'unhealthy' ? 'unhealthy' : s.status === 'warning' ? 'warning' : 'unknown'}">

                        <h2>

        function createServiceCard(name, data, serviceKey) {
            const card = document.createElement('div');
            card.className = 'status-card';

            let status = 'unknown';
            let statusText = 'Unknown';
            let details = '';
            const responseTime = responseTimes[serviceKey] || 'N/A';

            if (data) {
                if (data.status === 'healthy') {
                    status = 'healthy';
                    statusText = 'Healthy';
                } else if (data.status === 'unhealthy' || data.error) {
                    status = 'unhealthy';
                    statusText = 'Unhealthy';
                } else {
                    status = 'warning';
                    statusText = 'Warning';
                }

                if (data.service) details += `<p><strong>Service:</strong> <span class="detail-value">${data.service}</span></p>`;
                if (data.version) details += `<p><strong>Version:</strong> <span class="detail-value">${data.version}</span></p>`;
                if (data.database) {
                    const dbStatus = typeof data.database === 'string' ? data.database : 'Connected';
                    details += `<p><strong>Database:</strong> <span class="detail-value">${dbStatus}</span></p>`;
                }
                if (data.database_info) {
                    details += `<p><strong>DB Name:</strong> <span class="detail-value">${data.database_info.database || 'N/A'}</span></p>`;
                    if (data.database_info.active_connections) {
                        details += `<p><strong>Active Connections:</strong> <span class="detail-value">${data.database_info.active_connections}</span></p>`;
                    }
                }
                if (data.redis) {
                    details += `<p><strong>Redis:</strong> <span class="detail-value">${data.redis}</span></p>`;
                }
                if (data.error) {
                    details += `<p style="color: #ef4444;"><strong>Error:</strong> ${data.error}</p>`;
                }
            } else {
                statusText = 'Not Checked';
            }

            const cardId = `card-${serviceKey}`;
            card.innerHTML = `
                <div class="status-card-header">
                    <h2>
                        <span class="status-indicator ${status}"></span>
                        ${name}
                    </h2>
                    <span class="status-badge ${status}">${statusText}</span>
                </div>
                <div class="status-details">
                    ${details}
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <div class="metric-value">${responseTime}ms</div>
                            <div class="metric-label">Response Time</div>
                        </div>
                        ${data && data.timestamp ? `
                            <div class="metric-item">
                                <div class="metric-value">${formatTimestamp(data.timestamp)}</div>
                                <div class="metric-label">Last Check</div>
                            </div>
                        ` : ''}
                    </div>
                    ${data && typeof data === 'object' ? `
                        <div class="expandable-section">
                            <button class="expand-toggle" onclick="toggleExpand('${cardId}')">
                                <span>View Raw JSON</span>
                                <span id="${cardId}-icon">▼</span>
                            </button>
                            <div class="expand-content" id="${cardId}-content">
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                                <button class="btn copy-btn" onclick="copyToClipboard('${cardId}-content')">📋 Copy JSON</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            return card;
        }

        function createDatabaseCard(dbData) {
            const card = document.createElement('div');
            card.className = 'status-card';

            const overallStatus = dbData.overall_status || dbData.status || 'unknown';
            const status = overallStatus === 'healthy' ? 'healthy' : 'unhealthy';
            const statusText = overallStatus === 'healthy' ? 'Healthy' : 'Unhealthy';

            let details = '';
            if (dbData.database) {
                const dbStatus = dbData.database === 'healthy' ? 'Connected' : dbData.database;
                details += `<p><strong>Database:</strong> <span class="detail-value">${dbStatus}</span></p>`;
            }
            if (dbData.redis) {
                const redisStatus = dbData.redis === 'healthy' ? 'Connected' : dbData.redis;
                details += `<p><strong>Redis:</strong> <span class="detail-value">${redisStatus}</span></p>`;
            }
            if (dbData.service) {
                details += `<p><strong>Service:</strong> <span class="detail-value">${dbData.service}</span></p>`;
            }

            const responseTime = responseTimes.database || 'N/A';

            card.innerHTML = `
                <div class="status-card-header">
                    <h2>
                        <span class="status-indicator ${status}"></span>
                        Database Service (Detailed)
                    </h2>
                    <span class="status-badge ${status}">${statusText}</span>
                </div>
                <div class="status-details">
                    ${details}
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <div class="metric-value">${responseTime}ms</div>
                            <div class="metric-label">Response Time</div>
                        </div>
                        ${dbData.timestamp ? `
                            <div class="metric-item">
                                <div class="metric-value">${formatTimestamp(dbData.timestamp)}</div>
                                <div class="metric-label">Last Check</div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="expandable-section">
                        <button class="expand-toggle" onclick="toggleExpand('db-detailed')">
                            <span>View Raw JSON</span>
                            <span id="db-detailed-icon">▼</span>
                        </button>
                        <div class="expand-content" id="db-detailed-content">
                            <pre>${JSON.stringify(dbData, null, 2)}</pre>
                            <button class="btn copy-btn" onclick="copyToClipboard('db-detailed-content')">📋 Copy JSON</button>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        function createGatewayDatabaseCard(dbStatus) {
            const card = document.createElement('div');
            card.className = 'status-card';

            const hasError = dbStatus.database && dbStatus.database.includes('error');
            const status = hasError ? 'warning' : 'healthy';
            const statusText = hasError ? 'Warning' : 'Connected';

            card.innerHTML = `
                <div class="status-card-header">
                    <h2>
                        <span class="status-indicator ${status}"></span>
                        Gateway Database Connection
                    </h2>
                    <span class="status-badge ${status}">${statusText}</span>
                </div>
                <div class="status-details">
                    ${hasError ? `
                        <p style="color: #ef4444;"><strong>Note:</strong> ${dbStatus.database}</p>
                    ` : `
                        <p><strong>Status:</strong> <span class="detail-value">Connected</span></p>
                    `}
                </div>
            `;

            return card;
        }

        function toggleExpand(cardId) {
            const content = document.getElementById(`${cardId}-content`);
            const icon = document.getElementById(`${cardId}-icon`);
            
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                icon.textContent = '▼';
            } else {
                content.classList.add('show');
                icon.textContent = '▲';
            }
        }

        function copyToClipboard(elementId) {
            const content = document.getElementById(elementId);
            const pre = content.querySelector('pre');
            const text = pre.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = content.querySelector('.copy-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✓ Copied!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '#10b981';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('vi-VN');
        }

                        {
                            id: 'database-redis',
                            from: 'Database Service',
                            to: 'Redis',
                            protocol: 'Redis',
                            endpoints: ['Cache operations'],
                            requestPaths: [
                                'Database Service → Redis: SET cache',
                                'Database Service → Redis: GET cache',
                                'Database Service → Redis: DEL cache'
                            ]
                        }
                    ]
                }
            };
        }

        function getDefaultMonitoringData() {
            return {
                health: {
                    status: 'unknown'
                },
                services: {
                    dcf: { status: 'unknown', running_analyses: 0, analyses: [] },
                    stock: { status: 'unknown' },
                    database: { status: 'unknown' }
                }
            };
        }

        function updateArchitectureDiagram(architecture, monitoringData = {}) {
            const container = document.getElementById('networkDiagram');
            
            const activeRequests = monitoringData.services?.dcf?.analyses || [];
            const activeConnections = new Set();
            
            activeRequests.forEach(req => {
                if (req.status === 'running' || req.status === 'processing') {
                    activeConnections.add('frontend-gateway');
                    activeConnections.add('gateway-dcf');
                    activeConnections.add('dcf-postgres');
                    activeConnections.add('dcf-redis');
                }
            });
            
            if (monitoringData.services?.stock?.active_requests) {
                activeConnections.add('frontend-gateway');
                activeConnections.add('gateway-stock');
                activeConnections.add('stock-postgres');
                activeConnections.add('stock-redis');
            }
            const legendEl = document.getElementById('legend');
            
            const serviceGroups = {
                'frontend': { color: '#10b981', shape: 'box', icon: '🌐', label: 'Frontend (Nginx)' },
                'api': { color: '#3b82f6', shape: 'ellipse', icon: '🚪', label: 'API Gateway (HTTPS)' },
                'service': { color: '#6366f1', shape: 'ellipse', icon: '⚙️', label: 'Microservices' },
                'database': { color: '#8b5cf6', shape: 'database', icon: '🗄️', label: 'PostgreSQL' },
                'cache': { color: '#f59e0b', shape: 'diamond', icon: '⚡', label: 'Redis Cache' }
            };

            const activeCount = activeConnections.size;
            legendEl.innerHTML = `
                ${Object.values(serviceGroups).map(group => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${group.color};"></div>
                    <span>${group.icon} ${group.label}</span>
                </div>
                `).join('')}
                <div class="legend-item" style="border-left: 3px solid #ef4444; padding-left: 8px;">
                    <div class="legend-color" style="background: #ef4444; width: 20px; height: 3px;"></div>
                    <span>⚡ Active Request (${activeCount})</span>
                </div>
            `;

            const nodes = architecture.services.map(service => {
                const group = getServiceGroup(service.type, service.name);
                const style = serviceGroups[group] || serviceGroups.service;
                
                let level = 0;
                if (service.name === 'Frontend') level = 0;
                else if (service.name === 'Gateway') level = 1;
                else if (['DCF Service', 'Stock Service', 'Database Service'].includes(service.name)) level = 2;
                else if (['PostgreSQL', 'Redis'].includes(service.name)) level = 3;
                
                let label = `${style.icon}\n${service.name}\n:${service.port}`;
                if (service.name === 'Gateway') {
                    label = `${style.icon}\n${service.name}\n:${service.port}\n🔒 HTTPS`;
                }
                
                const requestPathsText = service.requestPaths 
                    ? service.requestPaths.map(rp => `${rp.path}: ${rp.method} ${rp.endpoint}`).join('\n')
                    : 'No request paths defined';
                
                const title = `${service.name}\n\n${service.description}\n\nPort: ${service.port}\n\nDependencies: ${service.dependencies.join(', ') || 'None'}\n\nRequest Paths:\n${requestPathsText}`;
                
                return {
                    id: service.name,
                    label: label,
                    title: title,
                    color: {
                        background: style.color,
                        border: darkenColor(style.color, 25),
                        highlight: {
                            background: lightenColor(style.color, 15),
                            border: darkenColor(style.color, 35)
                        },
                        hover: {
                            background: lightenColor(style.color, 10),
                            border: darkenColor(style.color, 30)
                        }
                    },
                    shape: style.shape,
                    font: {
                        size: 15,
                        face: 'Segoe UI, Arial',
                        color: '#ffffff',
                        bold: true,
                        multi: 'html'
                    },
                    size: getServiceSize(service.type, service.name),
                    borderWidth: 3,
                    level: level,
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.4)',
                        size: 12,
                        x: 5,
                        y: 5
                    },
                    chosen: {
                        node: function(values, id, selected, hovering) {
                            values.size = values.size + 8;
                            values.shadow.size = 18;
                            values.borderWidth = 5;
                        }
                    }
                };
            });

            const edges = architecture.connections.map((conn, index) => {
                const protocolColors = {
                    'HTTPS': '#10b981',
                    'HTTP': '#3b82f6',
                    'PostgreSQL': '#8b5cf6',
                    'Redis': '#f59e0b'
                };
                
                const isHTTPS = conn.protocol === 'HTTPS';
                const isActive = activeConnections.has(conn.id);
                const edgeWidth = isHTTPS ? (isActive ? 5 : 4) : (isActive ? 4 : 3);
                const edgeLabel = isHTTPS ? `🔒 ${conn.protocol}` : conn.protocol;
                
                const requestPathsText = conn.requestPaths 
                    ? conn.requestPaths.join('\n')
                    : 'No request paths';
                
                const title = `${conn.protocol} Connection\n\nFrom: ${conn.from}\nTo: ${conn.to}\n\nEndpoints:\n${conn.endpoints?.join('\n') || 'N/A'}\n\nRequest Paths:\n${requestPathsText}${isActive ? '\n\n⚡ ACTIVE REQUEST' : ''}`;
                
                return {
                    id: conn.id,
                    from: conn.from,
                    to: conn.to,
                    label: edgeLabel,
                    title: title,
                    arrows: {
                        to: {
                            enabled: true,
                            scaleFactor: 1.2,
                            type: 'arrow'
                        }
                    },
                    color: {
                        color: isActive ? '#ef4444' : (protocolColors[conn.protocol] || '#6b7280'),
                        highlight: isActive ? '#dc2626' : lightenColor(protocolColors[conn.protocol] || '#6b7280', 20),
                        hover: isActive ? '#ef4444' : (protocolColors[conn.protocol] || '#6b7280')
                    },
                    width: edgeWidth,
                    dashes: isHTTPS ? false : (isActive ? [5, 5] : false),
                    animation: isActive ? {
                        duration: 1000,
                        easingFunction: 'linear'
                    } : undefined,
                    smooth: {
                        type: 'continuous',
                        roundness: 0.5
                    },
                    font: {
                        size: isActive ? 12 : 11,
                        align: 'middle',
                        color: isActive ? '#ef4444' : '#374151',
                        background: '#ffffff',
                        strokeWidth: 2,
                        strokeColor: '#ffffff',
                        bold: isActive
                    },
                    labelHighlightBold: isActive,
                    selectionWidth: isActive ? 5 : 4,
                    hoverWidth: isActive ? 5 : 4
                };
            });

            const data = { nodes, edges };
            
            const options = {
                nodes: {
                    font: {
                        size: 16,
                        face: 'Arial',
                        color: '#ffffff',
                        bold: true
                    },
                    borderWidth: 3,
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.3)',
                        size: 10
                    }
                },
                edges: {
                    width: 3,
                    smooth: {
                        type: 'continuous',
                        roundness: 0.5
                    },
                    font: {
                        size: 11,
                        align: 'middle'
                    },
                    arrows: {
                        to: {
                            enabled: true,
                            scaleFactor: 1.2
                        }
                    }
                },
                physics: {
                    enabled: true,
                    stabilization: {
                        enabled: true,
                        iterations: 200,
                        fit: true
                    },
                    barnesHut: {
                        gravitationalConstant: -2000,
                        centralGravity: 0.1,
                        springLength: 200,
                        springConstant: 0.04,
                        damping: 0.09,
                        avoidOverlap: 0.5
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 100,
                    zoomView: true,
                    dragView: true
                },
                layout: {
                    hierarchical: {
                        enabled: true,
                        direction: 'UD',
                        sortMethod: 'directed',
                        levelSeparation: 180,
                        nodeSpacing: 250,
                        treeSpacing: 300,
                        blockShifting: true,
                        edgeMinimization: true,
                        parentCentralization: true,
                        shakeTowards: 'leaves',
                        shake: true
                    }
                }
            };

            if (network) {
                network.destroy();
            }
            network = new vis.Network(container, data, options);
            
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodes.find(n => n.id === nodeId);
                    if (node) {
                        console.log('Selected node:', node);
                    }
                }
            });
        }

        function getServiceGroup(type, name) {
            if (type === 'nginx') return 'frontend';
            if (name === 'Gateway') return 'api';
            if (type === 'fastapi') return 'service';
            if (type === 'database') return 'database';
            if (type === 'cache') return 'cache';
            return 'service';
        }

        function getServiceSize(type, name) {
            if (name === 'Gateway') return 60;
            
            const sizes = {
                'nginx': 45,
                'fastapi': 50,
                'database': 55,
                'cache': 40
            };
            return sizes[type] || 45;
        }

        function darkenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        function updateRequestsList(data) {
            const listEl = document.getElementById('requestsList');
            const analyses = data.services?.dcf?.analyses || [];

            if (analyses.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <p>Không có request nào đang xử lý</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = analyses.map(analysis => {
                const status = analysis.status || 'unknown';
                const progress = analysis.progress_percent || 0;
                const progressMsg = analysis.progress || '';

                return `
                    <div class="request-item">
                        <div class="request-header">
                            <div class="request-ticker">${analysis.ticker || 'N/A'}</div>
                            <div class="request-status ${status}">${status.toUpperCase()}</div>
                        </div>
                        <div class="request-progress">
                            <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">
                                ${progressMsg}
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        <div class="request-details">
                            ${analysis.started_at ? `<p><strong>Started:</strong> ${new Date(analysis.started_at).toLocaleString('vi-VN')}</p>` : ''}
                            ${analysis.completed_at ? `<p><strong>Completed:</strong> ${new Date(analysis.completed_at).toLocaleString('vi-VN')}</p>` : ''}
                            ${analysis.error ? `<p style="color: #ef4444;"><strong>Error:</strong> ${analysis.error}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(refreshData, 10000);
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        function exportData() {
            if (!healthData) {
                alert('No data to export. Please refresh first.');
                return;
            }

            const dataStr = JSON.stringify(healthData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `monitoring-health-${new Date().toISOString()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // Initial load
        refreshData();
    </script>
</body>
</html>
