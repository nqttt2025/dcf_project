<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCF Project - System Monitoring</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .auto-refresh input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        #networkDiagram {
            width: 100%;
            height: 700px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-card {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .status-card.healthy {
            border-left-color: #10b981;
        }

        .status-card.unhealthy {
            border-left-color: #ef4444;
        }

        .status-card.warning {
            border-left-color: #f59e0b;
        }

        .status-card h3 {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .status-card .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .requests-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .request-item {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            transition: background 0.2s;
        }

        .request-item:hover {
            background: #f9fafb;
        }

        .request-item:last-child {
            border-bottom: none;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .request-ticker {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .request-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .request-status.running {
            background: #dbeafe;
            color: #1e40af;
        }

        .request-status.processing {
            background: #fef3c7;
            color: #92400e;
        }

        .request-status.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .request-status.failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .request-progress {
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }

        .request-details {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .request-details p {
            margin: 3px 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            color: #ef4444;
            padding: 15px;
            background: #fee2e2;
            border-radius: 5px;
            margin: 10px 0;
        }

        .timestamp {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        #legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: #f9fafb;
            border-radius: 5px;
            font-size: 0.85em;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 2px solid rgba(0,0,0,0.2);
        }

        .legend-shape {
            width: 20px;
            height: 20px;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 DCF Project - System Monitoring Dashboard</h1>
            <p>Real-time monitoring của kiến trúc microservices và các request đang xử lý</p>
        </div>

        <div class="controls">
            <div>
                <button class="btn" onclick="refreshData()">🔄 Refresh</button>
                <div class="auto-refresh" style="display: inline-block; margin-left: 20px;">
                    <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                    <label for="autoRefresh">Auto-refresh (10s)</label>
                </div>
            </div>
            <div class="timestamp" id="timestamp"></div>
        </div>

        <div id="loading" class="loading">Đang tải dữ liệu...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="status-grid" id="statusGrid"></div>

            <div class="main-content">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 style="margin: 0;">📊 Architecture Diagram</h2>
                        <div id="legend" style="display: flex; gap: 15px; font-size: 0.85em; flex-wrap: wrap;"></div>
                    </div>
                    <div id="networkDiagram"></div>
                </div>

                <div class="card">
                    <h2>🔄 Active Requests</h2>
                    <div id="requestsList" class="requests-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">⏳</div>
                            <p>Không có request nào đang xử lý</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let network = null;

        async function refreshData() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const contentEl = document.getElementById('content');
            const timestampEl = document.getElementById('timestamp');

            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            contentEl.style.display = 'none';

            try {
                // Get architecture data
                const archResponse = await fetch('/api/architecture');
                const archData = await archResponse.json();

                // Get monitoring data
                const monitoringResponse = await fetch('/api/monitoring');
                const monitoringData = await monitoringResponse.json();

                // Update status grid
                updateStatusGrid(monitoringData);

                // Update architecture diagram
                updateArchitectureDiagram(archData.architecture);

                // Update requests list
                updateRequestsList(monitoringData);

                timestampEl.textContent = `Last updated: ${new Date().toLocaleString('vi-VN')}`;
                contentEl.style.display = 'block';
            } catch (error) {
                errorEl.textContent = `Error loading data: ${error.message}`;
                errorEl.style.display = 'block';
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        function updateStatusGrid(data) {
            const gridEl = document.getElementById('statusGrid');
            const health = data.health || {};
            const services = data.services || {};

            const statuses = [
                {
                    title: 'Gateway',
                    value: health.status || 'unknown',
                    status: health.status || 'unknown'
                },
                {
                    title: 'DCF Service',
                    value: services.dcf?.status || 'unknown',
                    status: services.dcf?.status || 'unknown'
                },
                {
                    title: 'Stock Service',
                    value: services.stock?.status || 'unknown',
                    status: services.stock?.status || 'unknown'
                },
                {
                    title: 'Database Service',
                    value: services.database?.status || 'unknown',
                    status: services.database?.status || 'unknown'
                },
                {
                    title: 'Running Analyses',
                    value: services.dcf?.running_analyses || 0,
                    status: 'info'
                }
            ];

            gridEl.innerHTML = statuses.map(s => `
                <div class="status-card ${s.status === 'healthy' ? 'healthy' : s.status === 'unhealthy' ? 'unhealthy' : s.status === 'warning' ? 'warning' : ''}">
                    <h3>${s.title}</h3>
                    <div class="value">${s.value}</div>
                </div>
            `).join('');
        }

        function updateArchitectureDiagram(architecture) {
            const container = document.getElementById('networkDiagram');
            const legendEl = document.getElementById('legend');
            
            // Define service groups and styling with better colors
            const serviceGroups = {
                'frontend': { color: '#10b981', shape: 'box', icon: '🌐', label: 'Frontend' },
                'api': { color: '#3b82f6', shape: 'ellipse', icon: '🚪', label: 'API Gateway' },
                'service': { color: '#6366f1', shape: 'ellipse', icon: '⚙️', label: 'Services' },
                'database': { color: '#8b5cf6', shape: 'database', icon: '🗄️', label: 'Database' },
                'cache': { color: '#f59e0b', shape: 'diamond', icon: '⚡', label: 'Cache' }
            };

            // Update legend
            legendEl.innerHTML = Object.values(serviceGroups).map(group => `
                <div class="legend-item">
                    <div class="legend-color" style="background: ${group.color};"></div>
                    <span>${group.icon} ${group.label}</span>
                </div>
            `).join('');

            // Create nodes with better styling and grouping
            const nodes = architecture.services.map(service => {
                const group = getServiceGroup(service.type, service.name);
                const style = serviceGroups[group] || serviceGroups.service;
                
                // Determine level for hierarchical layout
                let level = 0;
                if (service.name === 'Frontend') level = 0;
                else if (service.name === 'Gateway') level = 1;
                else if (['DCF Service', 'Stock Service', 'Database Service'].includes(service.name)) level = 2;
                else if (['PostgreSQL', 'Redis'].includes(service.name)) level = 3;
                
                return {
                    id: service.name,
                    label: `${style.icon}\n${service.name}\n:${service.port}`,
                    title: `${service.name}\n\n${service.description}\n\nPort: ${service.port}\n\nDependencies: ${service.dependencies.join(', ') || 'None'}`,
                    color: {
                        background: style.color,
                        border: darkenColor(style.color, 25),
                        highlight: {
                            background: lightenColor(style.color, 15),
                            border: darkenColor(style.color, 35)
                        },
                        hover: {
                            background: lightenColor(style.color, 10),
                            border: darkenColor(style.color, 30)
                        }
                    },
                    shape: style.shape,
                    font: {
                        size: 15,
                        face: 'Segoe UI, Arial',
                        color: '#ffffff',
                        bold: true,
                        multi: 'html'
                    },
                    size: getServiceSize(service.type, service.name),
                    borderWidth: 3,
                    level: level,
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.4)',
                        size: 12,
                        x: 5,
                        y: 5
                    },
                    chosen: {
                        node: function(values, id, selected, hovering) {
                            values.size = values.size + 8;
                            values.shadow.size = 18;
                            values.borderWidth = 5;
                        }
                    }
                };
            });

            // Create edges with better styling
            const edges = architecture.connections.map((conn, index) => {
                const protocolColors = {
                    'HTTP': '#3b82f6',
                    'PostgreSQL': '#8b5cf6',
                    'Redis': '#f59e0b'
                };
                
                return {
                    from: conn.from,
                    to: conn.to,
                    label: conn.protocol,
                    title: conn.endpoints ? `Endpoints: ${conn.endpoints.join(', ')}` : '',
                    arrows: {
                        to: {
                            enabled: true,
                            scaleFactor: 1.2,
                            type: 'arrow'
                        }
                    },
                    color: {
                        color: protocolColors[conn.protocol] || '#6b7280',
                        highlight: lightenColor(protocolColors[conn.protocol] || '#6b7280', 20),
                        hover: protocolColors[conn.protocol] || '#6b7280'
                    },
                    width: 3,
                    smooth: {
                        type: 'continuous',
                        roundness: 0.5
                    },
                    font: {
                        size: 11,
                        align: 'middle',
                        color: '#374151',
                        background: '#ffffff',
                        strokeWidth: 2,
                        strokeColor: '#ffffff'
                    },
                    labelHighlightBold: false,
                    selectionWidth: 4,
                    hoverWidth: 4
                };
            });

            const data = { nodes, edges };
            
            // Improved layout options
            const options = {
                nodes: {
                    font: {
                        size: 16,
                        face: 'Arial',
                        color: '#ffffff',
                        bold: true
                    },
                    borderWidth: 3,
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.3)',
                        size: 10
                    }
                },
                edges: {
                    width: 3,
                    smooth: {
                        type: 'continuous',
                        roundness: 0.5
                    },
                    font: {
                        size: 11,
                        align: 'middle'
                    },
                    arrows: {
                        to: {
                            enabled: true,
                            scaleFactor: 1.2
                        }
                    }
                },
                physics: {
                    enabled: true,
                    stabilization: {
                        enabled: true,
                        iterations: 200,
                        fit: true
                    },
                    barnesHut: {
                        gravitationalConstant: -2000,
                        centralGravity: 0.1,
                        springLength: 200,
                        springConstant: 0.04,
                        damping: 0.09,
                        avoidOverlap: 0.5
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 100,
                    zoomView: true,
                    dragView: true
                },
                layout: {
                    hierarchical: {
                        enabled: true,
                        direction: 'UD',
                        sortMethod: 'directed',
                        levelSeparation: 180,
                        nodeSpacing: 250,
                        treeSpacing: 300,
                        blockShifting: true,
                        edgeMinimization: true,
                        parentCentralization: true,
                        shakeTowards: 'leaves',
                        shake: true
                    }
                }
            };

            if (network) {
                network.destroy();
            }
            network = new vis.Network(container, data, options);
            
            // Add event listeners for better interactivity
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodes.find(n => n.id === nodeId);
                    if (node) {
                        console.log('Selected node:', node);
                    }
                }
            });
        }

        function getServiceGroup(type, name) {
            if (type === 'nginx') return 'frontend';
            if (name === 'Gateway') return 'api';
            if (type === 'fastapi') return 'service';
            if (type === 'database') return 'database';
            if (type === 'cache') return 'cache';
            return 'service';
        }

        function getServiceSize(type, name) {
            // Gateway is larger
            if (name === 'Gateway') return 60;
            
            const sizes = {
                'nginx': 45,
                'fastapi': 50,
                'database': 55,
                'cache': 40
            };
            return sizes[type] || 45;
        }

        function darkenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        function updateRequestsList(data) {
            const listEl = document.getElementById('requestsList');
            const analyses = data.services?.dcf?.analyses || [];

            if (analyses.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏳</div>
                        <p>Không có request nào đang xử lý</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = analyses.map(analysis => {
                const status = analysis.status || 'unknown';
                const progress = analysis.progress_percent || 0;
                const progressMsg = analysis.progress || '';

                return `
                    <div class="request-item">
                        <div class="request-header">
                            <div class="request-ticker">${analysis.ticker || 'N/A'}</div>
                            <div class="request-status ${status}">${status.toUpperCase()}</div>
                        </div>
                        <div class="request-progress">
                            <div style="font-size: 0.85em; color: #666; margin-bottom: 5px;">
                                ${progressMsg}
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        <div class="request-details">
                            ${analysis.started_at ? `<p><strong>Started:</strong> ${new Date(analysis.started_at).toLocaleString('vi-VN')}</p>` : ''}
                            ${analysis.completed_at ? `<p><strong>Completed:</strong> ${new Date(analysis.completed_at).toLocaleString('vi-VN')}</p>` : ''}
                            ${analysis.error ? `<p style="color: #ef4444;"><strong>Error:</strong> ${analysis.error}</p>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(refreshData, 10000); // 10 seconds
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        // Initial load
        refreshData();
    </script>
</body>
</html>
