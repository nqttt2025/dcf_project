<!DOCTYPE html>

<body>
    <div class="database-container">

                    <a href="/">📊 Dashboard</a>
                    <a href="/static/stock-info.html">📈 Stock Info</a>

            <div class="search-box">

                <span class="search-icon">🔍</span>

            <button class="btn btn-primary" onclick="loadDatabaseInfo()">
                🔄 Refresh
            </button>

                <select id="syncTableSelect">
                    <option value="financial_data">📊 Financial Data</option>

        <div id="loading" class="loading" style="display: none;">Loading...</div>

        <div id="content" style="display: none;">
            <!-- Database Statistics -->
            <div class="section">
                <h2>📊 Database Statistics</h2>
                <div class="stats-grid" id="stats-grid"></div>
            </div>
            
            <!-- ER Diagram -->
            <div class="section">
                <h2>🔗 Entity Relationship Diagram</h2>
                <div id="er-diagram"></div>

    <script>
        const DATABASE_SERVICE_URL = '/api/database';
        let isRefreshing = false;
        let erNetwork = null;
        let allTables = [];
        
        // Convert GMT timestamp to GMT+7 (Ho Chi Minh City time) and format for display
        function formatTimestampGMT7(timestamp) {
            if (!timestamp) return 'N/A';
            
            try {
                let date;
                if (typeof timestamp === 'string') {
                    if (timestamp.includes('UTC')) {
                        const cleanTimestamp = timestamp.replace(' UTC', '');
                        date = new Date(cleanTimestamp + 'Z');
                    } else if (timestamp.includes('T') || timestamp.includes('Z') || timestamp.includes('+')) {
                        date = new Date(timestamp);
                    } else {
                        date = new Date(timestamp);
                    }
                } else {
                    date = new Date(timestamp);
                }
                
                if (isNaN(date.getTime())) {
                    return 'Invalid date';
                }
                
                const gmt7Offset = 7 * 60;
                const utcTime = date.getTime() + (date.getTimezoneOffset() * 60000);
                const gmt7Time = new Date(utcTime + (gmt7Offset * 60000));
                
                return gmt7Time.toLocaleString('vi-VN', {
                    timeZone: 'Asia/Ho_Chi_Minh',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }) + ' GMT+7';
            } catch (error) {
                console.error('Error formatting timestamp:', error, timestamp);
                return 'Invalid date';
            }
        }
        
        // Format timestamp short (no seconds)
        function formatTimestampShort(timestamp) {
            if (!timestamp) return 'N/A';
            
            try {
                let date;
                if (typeof timestamp === 'string') {
                    if (timestamp.includes('UTC')) {
                        const cleanTimestamp = timestamp.replace(' UTC', '');
                        date = new Date(cleanTimestamp + 'Z');
                    } else if (timestamp.includes('T') || timestamp.includes('Z') || timestamp.includes('+')) {
                        date = new Date(timestamp);
                    } else {
                        date = new Date(timestamp);
                    }
                } else {
                    date = new Date(timestamp);
                }
                
                if (isNaN(date.getTime())) {
                    return 'Invalid date';
                }
                
                const gmt7Offset = 7 * 60;
                const utcTime = date.getTime() + (date.getTimezoneOffset() * 60000);
                const gmt7Time = new Date(utcTime + (gmt7Offset * 60000));
                
                return gmt7Time.toLocaleString('vi-VN', {
                    timeZone: 'Asia/Ho_Chi_Minh',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                }) + ' GMT+7';
            } catch (error) {
                console.error('Error formatting timestamp:', error, timestamp);
                return 'Invalid date';
            }
        }
        
        async function loadDatabaseInfo() {
            if (isRefreshing) {
                console.log('Refresh already in progress, skipping...');
                return;
            }
            
            isRefreshing = true;
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const contentEl = document.getElementById('content');
            
            if (loadingEl) loadingEl.style.display = 'block';
            if (errorEl) errorEl.style.display = 'none';
            if (contentEl) contentEl.style.display = 'none';
            
            try {
                const [statsResponse, tablesResponse] = await Promise.all([
                    fetch(`${DATABASE_SERVICE_URL}/stats`),
                    fetch(`${DATABASE_SERVICE_URL}/tables`)
                ]);
                
                if (!statsResponse.ok) throw new Error(`Stats fetch failed: ${statsResponse.status}`);
                if (!tablesResponse.ok) throw new Error(`Tables fetch failed: ${tablesResponse.status}`);
                
                const stats = await statsResponse.json();
                const tables = await tablesResponse.json();
                
                displayStats(stats);
                allTables = tables.tables || [];
                await displayTables(allTables);
                await loadERDiagram();
                
                if (loadingEl) loadingEl.style.display = 'none';
                if (contentEl) contentEl.style.display = 'block';
            } catch (error) {
                console.error('Error loading database info:', error);
                if (loadingEl) loadingEl.style.display = 'none';
                if (errorEl) {
                    errorEl.style.display = 'block';
                    errorEl.innerHTML = `
                        <strong>Error loading database info:</strong> ${error.message}<br>
                        <button class="btn btn-primary" onclick="loadDatabaseInfo()" style="margin-top: 10px;">
                            🔄 Retry
                        </button>
                    `;
                }
            } finally {
                isRefreshing = false;
            }
        }
        
        function displayStats(stats) {
            const statsGrid = document.getElementById('stats-grid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>Total Tables</h3>
                    <div class="value">${stats.total_tables || 0}</div>
                    <div class="label">Tables in database</div>
                </div>
                <div class="stat-card">
                    <h3>Total Rows</h3>
                    <div class="value">${(stats.total_rows || 0).toLocaleString()}</div>
                    <div class="label">Total records</div>
                </div>
                <div class="stat-card">
                    <h3>Database Size</h3>
                    <div class="value" style="font-size: 24px;">${stats.database_size || 'N/A'}</div>
                    <div class="label">Storage used</div>
                </div>
                <div class="stat-card">
                    <h3>PostgreSQL</h3>
                    <div class="value" style="font-size: 18px;">${(stats.postgres_version || 'N/A').substring(0, 25)}</div>
                    <div class="label">Version</div>
                </div>
            `;
        }
        
        async function loadERDiagram() {
            try {
                const response = await fetch(`${DATABASE_SERVICE_URL}/relationships`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const relationships = await response.json();
                if (relationships && relationships.tables) {
                    displayERDiagram(relationships);
                }
            } catch (error) {
                console.error('Error loading ER diagram:', error);
                const container = document.getElementById('er-diagram');
                if (container) {
                    container.innerHTML = `<div class="error">Error loading ER diagram: ${error.message}</div>`;
                }
            }
        }
        
        function displayERDiagram(data) {
            const container = document.getElementById('er-diagram');
            
            const nodes = data.tables.map(table => ({
                id: table.name,
                label: `${table.name}\n(${table.columns.length} cols)`,
                title: `Columns: ${table.columns.join(', ')}\nPrimary Keys: ${table.primary_keys.join(', ') || 'None'}`,
                color: {
                    background: '#667eea',
                    border: '#1e40af',
                    highlight: { background: '#60a5fa', border: '#1e40af' }
                },
                shape: 'box',
                font: { size: 14, face: 'Arial', color: '#ffffff', bold: true },
                borderWidth: 2,
                shadow: true
            }));
            
            const edges = data.relationships.map(rel => ({
                from: rel.from_table,
                to: rel.to_table,
                label: `${rel.from_columns.join(', ')} → ${rel.to_columns.join(', ')}`,
                title: `${rel.from_table}.${rel.from_columns.join(', ')} → ${rel.to_table}.${rel.to_columns.join(', ')}`,
                arrows: 'to',
                color: { color: '#10b981', highlight: '#34d399' },
                width: 2,
                smooth: { type: 'continuous', roundness: 0.5 },
                font: { size: 10, align: 'middle', color: '#065f46', background: '#ffffff', strokeWidth: 2, strokeColor: '#ffffff' }
            }));
            
            const networkData = { nodes, edges };
            const options = {
                nodes: {
                    font: { size: 14, face: 'Arial', color: '#ffffff', bold: true },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    width: 2,
                    smooth: { type: 'continuous', roundness: 0.5 },
                    font: { size: 10, align: 'middle' },
                    arrows: { to: { enabled: true, scaleFactor: 1.2 } }
                },
                physics: {
                    enabled: true,
                    stabilization: { enabled: true, iterations: 200, fit: true, updateInterval: 25 },
                    barnesHut: {
                        gravitationalConstant: -2000,
                        centralGravity: 0.1,
                        springLength: 200,
                        springConstant: 0.04,
                        damping: 0.09,
                        avoidOverlap: 0.5
                    }
                },
                interaction: { hover: true, tooltipDelay: 100, zoomView: true, dragView: true },
                layout: { improvedLayout: true, hierarchical: { enabled: false } }
            };
            
            if (erNetwork) erNetwork.destroy();
            erNetwork = new vis.Network(container, networkData, options);
            
            erNetwork.once("stabilizationEnd", function() {
                erNetwork.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
            });
        }
        
        async function displayTables(tables) {
            const tablesInfo = document.getElementById('tables-info');
            
            if (!tables || tables.length === 0) {
                tablesInfo.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>No tables found.</p></div>';
                return;
            }
            
            let html = '<div class="tables-list">';
            for (const table of tables) {
                html += `
                    <div class="table-card" data-table="${table.name}">
                        <div class="table-header" onclick="toggleTableDetails('${table.name}')">
                            <div class="table-name-section">
                                <h3>📊 ${table.name}</h3>
                                <span class="badge badge-primary">${table.column_count} columns</span>
                            </div>
                            <span class="toggle-icon" id="icon-${table.name}">▼</span>
                        </div>
                        <div class="table-details" id="details-${table.name}">
                            <div class="loading-small">Loading schema...</div>
                        </div>
                    </div>
                `;
            }
            html += '</div>';
            tablesInfo.innerHTML = html;
        }
        
        function filterTables() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.toLowerCase();
            const tableCards = document.querySelectorAll('.table-card');
            
            tableCards.forEach(card => {
                const tableName = card.getAttribute('data-table').toLowerCase();
                if (tableName.includes(searchTerm)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }
        
        async function toggleTableDetails(tableName) {
            const card = document.querySelector(`[data-table="${tableName}"]`);
            const detailsEl = document.getElementById(`details-${tableName}`);
            const iconEl = document.getElementById(`icon-${tableName}`);
            
            if (card.classList.contains('expanded')) {
                card.classList.remove('expanded');
                iconEl.textContent = '▼';
            } else {
                card.classList.add('expanded');
                iconEl.textContent = '▲';
                
                if (detailsEl.querySelector('.loading-small')) {
                    try {
                        const response = await fetch(`${DATABASE_SERVICE_URL}/tables/${tableName}/schema`);
                        const schema = await response.json();
                        displayTableSchema(tableName, schema);
                    } catch (error) {
                        detailsEl.innerHTML = `<div class="error">Error loading schema: ${error.message}</div>`;
                    }
                }
            }
        }
        
        function displayTableSchema(tableName, schema) {
            const detailsEl = document.getElementById(`details-${tableName}`);
            
            let html = `
                <div class="data-tabs">
                    <button class="data-tab active" onclick="switchTableTab('${tableName}', 'schema')">📋 Schema</button>
                    <button class="data-tab" onclick="switchTableTab('${tableName}', 'data')">📊 Data</button>
                </div>
                <div class="tab-content active" id="tab-${tableName}-schema">
                    <div class="schema-content">
                        <div class="schema-section">
                            <h4>📈 Statistics</h4>
                            <div class="stats-row">
                                <span><strong>Rows:</strong> ${schema.row_count.toLocaleString()}</span>
                                <span><strong>Size:</strong> ${schema.table_size}</span>
                            </div>
                        </div>
                        <div class="schema-section">
                            <h4>📋 Columns (${schema.columns.length})</h4>
                            <table class="schema-table">
                                <thead>
                                    <tr>
                                        <th>Column Name</th>
                                        <th>Data Type</th>
                                        <th>Nullable</th>
                                        <th>Primary Key</th>
                                        <th>Default</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;
            
            schema.columns.forEach(col => {
                html += `
                    <tr>
                        <td><strong>${col.name}</strong></td>
                        <td><code>${col.type}</code></td>
                        <td class="${col.nullable ? '' : 'not-null'}">${col.nullable ? '✓' : '✗'}</td>
                        <td><span class="${col.primary_key ? 'pk-badge' : ''}">${col.primary_key ? 'PK' : ''}</span></td>
                        <td><code>${col.default !== 'None' ? col.default : '-'}</code></td>
                        </tr>
                    `;
                });
            
            html += '</tbody></table></div>';
            
            if (schema.primary_keys && schema.primary_keys.length > 0) {
                html += `
                    <div class="schema-section">
                        <h4>🔑 Primary Keys</h4>
                        <div class="key-list">
                            ${schema.primary_keys.map(pk => `<span class="key-badge pk-badge">${pk}</span>`).join('')}
                        </div>
                    </div>
                `;
            }
            
            if (schema.foreign_keys && schema.foreign_keys.length > 0) {
                html += `
                    <div class="schema-section">
                        <h4>🔗 Foreign Keys</h4>
                        <table class="schema-table">
                            <thead>
                                <tr>
                                    <th>Column(s)</th>
                                    <th>References</th>
                                    <th>Referenced Column(s)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                schema.foreign_keys.forEach(fk => {
                    html += `
                        <tr>
                            <td>${fk.constrained_columns.join(', ')}</td>
                            <td><strong>${fk.referred_table}</strong></td>
                            <td>${fk.referred_columns.join(', ')}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table></div>';
            }
            
            if (schema.indexes && schema.indexes.length > 0) {
                html += `
                    <div class="schema-section">
                        <h4>📑 Indexes</h4>
                        <table class="schema-table">
                            <thead>
                                <tr>
                                    <th>Index Name</th>
                                    <th>Columns</th>
                                    <th>Unique</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                schema.indexes.forEach(idx => {
                    html += `
                        <tr>
                            <td><code>${idx.name}</code></td>
                            <td>${idx.columns.join(', ')}</td>
                            <td>${idx.unique ? '✓' : '✗'}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table></div>';
            }
            
            html += '</div></div>';
            html += `<div class="tab-content" id="tab-${tableName}-data"><div class="loading-small">Click "Data" tab to load data...</div></div>`;
            
            detailsEl.innerHTML = html;
        }
        
        async function switchTableTab(tableName, tab) {
            const detailsEl = document.getElementById(`details-${tableName}`);
            const tabs = detailsEl.querySelectorAll('.data-tab');
            const contents = detailsEl.querySelectorAll('.tab-content');
            
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            
            if (tab === 'schema') {
                tabs[0].classList.add('active');
                document.getElementById(`tab-${tableName}-schema`).classList.add('active');
            } else {
                tabs[1].classList.add('active');
                const dataContent = document.getElementById(`tab-${tableName}-data`);
                dataContent.classList.add('active');
                
                if (dataContent.querySelector('.loading-small')) {
                    await loadTableData(tableName, 0, 100);
                }
            }
        }
        
        async function loadTableData(tableName, skip = 0, limit = 100) {
            const dataContent = document.getElementById(`tab-${tableName}-data`);
            if (!dataContent) return;
            
            dataContent.innerHTML = '<div class="loading-small">Loading data...</div>';
            
            try {
                const response = await fetch(`${DATABASE_SERVICE_URL}/tables/${tableName}/data?skip=${skip}&limit=${limit}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const result = await response.json();
                
                if (!result || !result.data || result.data.length === 0) {
                    const totalRows = result?.total_rows || 0;
                    
                    // Determine if this is a syncable table
                    const syncableTables = ['financial_data', 'market_data', 'shares_outstanding', 'growth_metrics'];
                    const isSyncable = syncableTables.includes(tableName);
                    
                    if (totalRows === 0) {
                        let message = `Table "${tableName}" is empty (0 rows)`;
                        let suggestion = '';
                        
                        if (isSyncable) {
                            const tableLabels = {
                                'financial_data': 'Financial Data',
                                'market_data': 'Market Data',
                                'shares_outstanding': 'Shares Outstanding',
                                'growth_metrics': 'Growth Metrics'
                            };
                            suggestion = `
                                <div style="margin-top: 20px; padding: 15px; background: #dbeafe; border-radius: 8px; border-left: 4px solid #3b82f6;">
                                    <strong>💡 Cần sync dữ liệu:</strong><br>
                                    Bảng này chưa có dữ liệu. Hãy sử dụng nút "Sync Data" ở trên để đồng bộ dữ liệu từ vnstock API.<br>
                                    <button class="btn btn-success" onclick="syncSpecificTable('${tableName}')" style="margin-top: 10px;">
                                        📊 Sync ${tableLabels[tableName] || tableName}
                                    </button>
                                </div>
                            `;
                        } else if (tableName === 'dcf_results') {
                            suggestion = `
                                <div style="margin-top: 20px; padding: 15px; background: #fef3c7; border-radius: 8px; border-left: 4px solid #f59e0b;">
                                    <strong>💡 Chưa có kết quả phân tích:</strong><br>
                                    Bảng này sẽ chứa kết quả DCF analysis. Hãy chạy phân tích từ trang Dashboard để tạo dữ liệu.
                                </div>
                            `;
                        }
                        
                        dataContent.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <p style="font-size: 18px; font-weight: 600; margin-bottom: 10px;">${message}</p>
                                ${suggestion}
                            </div>
                        `;
                    } else {
                        dataContent.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">⚠️</div>
                                <p>No data found for this page. Total rows: ${totalRows.toLocaleString()}</p>
                            </div>
                        `;
                    }
                    return;
                }
                
                let html = `
                    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-weight: 600; color: #495057;">Total: ${result.total_rows.toLocaleString()} rows</span>
                        <button class="export-btn" onclick="exportTableData('${tableName}', ${skip}, ${limit})">📥 Export CSV</button>
                    </div>
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead><tr>
                `;
                
                const columns = Object.keys(result.data[0]);
                columns.forEach(col => html += `<th>${col}</th>`);
                html += '</tr></thead><tbody>';
                
                result.data.forEach(row => {
                    html += '<tr>';
                    columns.forEach(col => {
                        const value = row[col];
                        let displayValue = value === null ? '<em style="color: #999;">NULL</em>' : 
                                         typeof value === 'string' && value.length > 100 ? 
                                         `<span title="${value.replace(/"/g, '&quot;')}">${value.substring(0, 100)}...</span>` : 
                                         value;
                        html += `<td>${displayValue}</td>`;
                    });
                    html += '</tr>';
                });
                
                html += '</tbody></table></div>';
                
                const totalPages = Math.ceil(result.total_rows / limit);
                const currentPage = Math.floor(skip / limit) + 1;
                
                html += `
                    <div class="pagination">
                        <div class="pagination-info">
                            Showing ${skip + 1} - ${Math.min(skip + limit, result.total_rows)} of ${result.total_rows.toLocaleString()} rows
                        </div>
                        <div class="pagination-controls">
                            <button class="pagination-btn" onclick="loadTableData('${tableName}', ${Math.max(0, skip - limit)}, ${limit})" 
                                    ${skip === 0 ? 'disabled' : ''}>← Previous</button>
                            <span style="padding: 8px 16px; font-weight: 600;">Page ${currentPage} of ${totalPages}</span>
                            <button class="pagination-btn" onclick="loadTableData('${tableName}', ${skip + limit}, ${limit})" 
                                    ${skip + limit >= result.total_rows ? 'disabled' : ''}>Next →</button>
                        </div>
                    </div>
                `;
                
                dataContent.innerHTML = html;
            } catch (error) {
                dataContent.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
            }
        }
        
        function exportTableData(tableName, skip, limit) {
            // Simple CSV export - in production, you might want to fetch all data
            alert(`Export functionality for ${tableName} (rows ${skip + 1}-${skip + limit}) would be implemented here.`);
        }
        
        async function syncSpecificTable(tableName) {
            // Set the select to the specific table and trigger sync
            const tableSelect = document.getElementById('syncTableSelect');
            tableSelect.value = tableName;
            await syncTable();
        }
        
        let syncPollInterval = null;
        
        async function syncTable(ticker = null) {
            const syncBtn = document.getElementById('syncBtn');
            const syncStatus = document.getElementById('syncStatus');
            const tableSelect = document.getElementById('syncTableSelect');
            const tableName = tableSelect.value;
            
            syncBtn.disabled = true;
            syncBtn.textContent = '⏳ Starting...';
            syncStatus.style.display = 'block';
            syncStatus.className = 'sync-status info';
            
            const tableLabels = {
                'financial_data': 'Financial Data',
                'market_data': 'Market Data',
                'shares_outstanding': 'Shares Outstanding',
                'growth_metrics': 'Growth Metrics'
            };
            
            syncStatus.innerHTML = `<strong>🔄 Starting sync...</strong><br>Table: ${tableLabels[tableName]}<br><div id="sync-progress" style="margin-top: 10px;"></div>`;
            
            try {
                let url = `${DATABASE_SERVICE_URL}/sync/${tableName}`;
                if (ticker) {
                    url += `?ticker=${ticker}`;
                } else if (tableName === 'market_data') {
                    url += '?days=30';
                }
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: `HTTP ${response.status}` }));
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                // If sync started successfully, poll for status
                if (result.status === 'running' || result.sync_id) {
                    syncStatus.innerHTML = `
                        <strong>🔄 Sync started!</strong><br>
                        Table: ${tableLabels[tableName]}<br>
                        <div id="sync-progress" style="margin-top: 10px;">
                            <div style="background: #e5e7eb; height: 8px; border-radius: 4px; overflow: hidden;">
                                <div id="progress-bar" style="background: #667eea; height: 100%; width: 0%; transition: width 0.3s;"></div>
                            </div>
                            <div id="progress-text" style="margin-top: 5px; font-size: 12px; color: #6b7280;">Initializing...</div>
                        </div>
                    `;
                    
                    // Start polling for status
                    const syncId = result.sync_id || `${tableName}_${ticker || 'all'}`;
                    pollSyncStatus(tableName, ticker, syncId);
                } else if (result.summary) {
                    // Immediate result (for growth_metrics)
                    displaySyncResult(result, tableLabels[tableName]);
                    syncBtn.disabled = false;
                    syncBtn.textContent = '📊 Sync Data';
                } else {
                    syncStatus.className = 'sync-status success';
                    syncStatus.textContent = `Sync started: ${result.message || 'Success'}`;
                    syncBtn.disabled = false;
                    syncBtn.textContent = '📊 Sync Data';
                }
            } catch (error) {
                syncStatus.className = 'sync-status error';
                syncStatus.innerHTML = `<strong>❌ Error:</strong><br>${error.message}`;
                syncBtn.disabled = false;
                syncBtn.textContent = '📊 Sync Data';
                if (syncPollInterval) {
                    clearInterval(syncPollInterval);
                    syncPollInterval = null;
                }
            }
        }
        
        async function pollSyncStatus(tableName, ticker, syncId) {
            let pollCount = 0;
            const maxPolls = 300; // 5 minutes max (1 poll per second)
            
            syncPollInterval = setInterval(async () => {
                pollCount++;
                
                if (pollCount > maxPolls) {
                    clearInterval(syncPollInterval);
                    syncPollInterval = null;
                    document.getElementById('syncStatus').innerHTML = `
                        <strong>⏱️ Timeout</strong><br>
                        Sync is taking longer than expected. Please check logs or try again.
                    `;
                    document.getElementById('syncBtn').disabled = false;
                    document.getElementById('syncBtn').textContent = '📊 Sync Data';
                    return;
                }
                
                try {
                    let url = `${DATABASE_SERVICE_URL}/sync/${tableName}/status`;
                    if (ticker) {
                        url += `?ticker=${ticker}`;
                    }
                    
                    const response = await fetch(url);
                    if (!response.ok) {
                        // Status endpoint might not be available, continue polling
                        return;
                    }
                    
                    const status = await response.json();
                    
                    if (status.status === 'completed') {
                        clearInterval(syncPollInterval);
                        syncPollInterval = null;
                        displaySyncResult(status, tableLabels[tableName] || tableName);
                        document.getElementById('syncBtn').disabled = false;
                        document.getElementById('syncBtn').textContent = '📊 Sync Data';
                        setTimeout(() => loadDatabaseInfo(), 1000);
                    } else if (status.status === 'failed') {
                        clearInterval(syncPollInterval);
                        syncPollInterval = null;
                        document.getElementById('syncStatus').className = 'sync-status error';
                        document.getElementById('syncStatus').innerHTML = `
                            <strong>❌ Sync failed</strong><br>
                            ${status.error || status.progress || 'Unknown error'}
                        `;
                        document.getElementById('syncBtn').disabled = false;
                        document.getElementById('syncBtn').textContent = '📊 Sync Data';
                    } else if (status.status === 'running') {
                        // Update progress
                        const progressBar = document.getElementById('progress-bar');
                        const progressText = document.getElementById('progress-text');
                        if (progressBar && progressText) {
                            const percent = status.progress_percent || 0;
                            progressBar.style.width = `${percent}%`;
                            progressText.textContent = status.progress || `Processing... ${percent}%`;
                        }
                    }
                } catch (error) {
                    // Continue polling on error
                    console.error('Error polling sync status:', error);
                }
            }, 1000); // Poll every second
        }
        
        function displaySyncResult(result, tableLabel) {
            const syncStatus = document.getElementById('syncStatus');
            const summary = result.summary || {};
            
            if (summary.success > 0) {
                syncStatus.className = 'sync-status success';
                syncStatus.innerHTML = `
                    <strong>✓ Sync completed!</strong><br>
                    Table: ${tableLabel}<br>
                    Processed: ${summary.processed || 0} stocks<br>
                    Success: ${summary.success || 0}<br>
                    Failed: ${summary.failed || 0}
                `;
            } else {
                syncStatus.className = 'sync-status info';
                const skipped = summary.details ? summary.details.filter(d => d.status === 'skipped').length : 0;
                syncStatus.innerHTML = `
                    <strong>⚠ Sync completed with warnings</strong><br>
                    Table: ${tableLabel}<br>
                    Processed: ${summary.processed || 0} stocks<br>
                    Success: ${summary.success || 0}<br>
                    Skipped: ${skipped}<br>
                    Failed: ${summary.failed || 0}
                    ${summary.error ? `<br><small>Error: ${summary.error}</small>` : ''}
                `;
            }
            
            setTimeout(() => { syncStatus.style.display = 'none'; }, 10000);
        }
        
        const tableLabels = {
            'financial_data': 'Financial Data',
            'market_data': 'Market Data',
            'shares_outstanding': 'Shares Outstanding',
            'growth_metrics': 'Growth Metrics'
        };
        
        // Initialize database info on page load
        loadDatabaseInfo();
    </script>
