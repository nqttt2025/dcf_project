<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCF Project - Health Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .status-card:hover {
            transform: translateY(-5px);
        }

        .status-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-indicator.healthy {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .status-indicator.unhealthy {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .status-indicator.warning {
            background: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .status-indicator.unknown {
            background: #6b7280;
        }

        .status-details {
            margin-top: 15px;
            font-size: 0.9em;
        }

        .status-details p {
            margin: 5px 0;
            color: #666;
        }

        .status-details strong {
            color: #333;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px 5px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .auto-refresh input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            color: #ef4444;
            padding: 10px;
            background: #fee2e2;
            border-radius: 5px;
            margin: 10px 0;
        }

        .timestamp {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .details-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .details-section h3 {
            font-size: 0.9em;
            color: #333;
            margin-bottom: 10px;
        }

        .details-section pre {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.85em;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 DCF Project Health Status</h1>
            <p>Real-time monitoring of all microservices</p>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <button class="refresh-btn" onclick="checkHealth()">🔄 Refresh</button>
            <div class="auto-refresh">
                <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                <label for="autoRefresh">Auto-refresh (30s)</label>
            </div>
        </div>

        <div id="loading" class="loading">Loading health status...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="statusGrid" class="status-grid" style="display: none;">
            <!-- Status cards will be inserted here -->
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        let autoRefreshInterval = null;

        async function checkHealth() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const statusGridEl = document.getElementById('statusGrid');
            const timestampEl = document.getElementById('timestamp');

            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            statusGridEl.style.display = 'none';

            try {
                // Check Gateway health (which includes all services)
                const gatewayResponse = await fetch('/api/health');
                const gatewayData = await gatewayResponse.json();

                // Check individual services
                const services = [
                    { name: 'Gateway', url: '/api/health', data: gatewayData },
                    { name: 'DCF Service', url: '/api/dcf/health', data: gatewayData.services?.dcf },
                    { name: 'Stock Service', url: '/api/stock/health', data: gatewayData.services?.stock },
                    { name: 'Database Service', url: '/api/database/health', data: gatewayData.services?.database },
                ];

                // Also check database and Redis from gateway
                const dbStatus = gatewayData.gateway_database || {};
                const redisStatus = gatewayData.services?.redis || {};

                displayStatus(services, dbStatus, redisStatus);
                
                timestampEl.textContent = `Last updated: ${new Date().toLocaleString('vi-VN')}`;
            } catch (error) {
                errorEl.textContent = `Error checking health: ${error.message}`;
                errorEl.style.display = 'block';
            } finally {
                loadingEl.style.display = 'none';
                statusGridEl.style.display = 'grid';
            }
        }

        function displayStatus(services, dbStatus, redisStatus) {
            const statusGridEl = document.getElementById('statusGrid');
            statusGridEl.innerHTML = '';

            // Display service statuses
            services.forEach(service => {
                const card = createServiceCard(service.name, service.data);
                statusGridEl.appendChild(card);
            });

            // Display database status
            if (dbStatus) {
                const dbCard = createDatabaseCard(dbStatus);
                statusGridEl.appendChild(dbCard);
            }

            // Display Redis status
            if (redisStatus) {
                const redisCard = createRedisCard(redisStatus);
                statusGridEl.appendChild(redisCard);
            }
        }

        function createServiceCard(name, data) {
            const card = document.createElement('div');
            card.className = 'status-card';

            let status = 'unknown';
            let statusText = 'Unknown';
            let details = '';

            if (data) {
                if (data.status === 'healthy' || (data.status && typeof data.status === 'object' && data.status.status === 'healthy')) {
                    status = 'healthy';
                    statusText = 'Healthy';
                } else if (data.status === 'unavailable' || data.error) {
                    status = 'unhealthy';
                    statusText = 'Unavailable';
                } else {
                    status = 'warning';
                    statusText = 'Warning';
                }

                // Extract details
                if (data.service) details += `<p><strong>Service:</strong> ${data.service}</p>`;
                if (data.database) details += `<p><strong>Database:</strong> ${data.database}</strong></p>`;
                if (data.error) details += `<p class="error"><strong>Error:</strong> ${data.error}</p>`;
            } else {
                statusText = 'Not Checked';
            }

            card.innerHTML = `
                <h2>
                    <span class="status-indicator ${status}"></span>
                    ${name}
                </h2>
                <div class="status-details">
                    <p><strong>Status:</strong> ${statusText}</p>
                    ${details}
                    ${data && typeof data === 'object' ? `
                        <div class="details-section">
                            <h3>Details:</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    ` : ''}
                </div>
            `;

            return card;
        }

        function createDatabaseCard(dbStatus) {
            const card = document.createElement('div');
            card.className = 'status-card';

            const connected = dbStatus.connected === true;
            const status = connected ? 'healthy' : 'unhealthy';
            const statusText = connected ? 'Connected' : 'Disconnected';

            let details = '';
            if (dbStatus.info) {
                details += `<p><strong>Database:</strong> ${dbStatus.info.name || 'N/A'}</p>`;
                details += `<p><strong>Size:</strong> ${dbStatus.info.size || 'N/A'}</p>`;
                details += `<p><strong>Tables:</strong> ${dbStatus.info.table_count || 'N/A'}</p>`;
            }
            if (dbStatus.error) {
                details += `<p class="error"><strong>Error:</strong> ${dbStatus.error}</p>`;
            }

            card.innerHTML = `
                <h2>
                    <span class="status-indicator ${status}"></span>
                    PostgreSQL Database
                </h2>
                <div class="status-details">
                    <p><strong>Status:</strong> ${statusText}</p>
                    ${details}
                </div>
            `;

            return card;
        }

        function createRedisCard(redisStatus) {
            const card = document.createElement('div');
            card.className = 'status-card';

            const status = redisStatus.status === 'healthy' ? 'healthy' : 'warning';
            const statusText = redisStatus.status === 'healthy' ? 'Connected' : 'Unknown';

            card.innerHTML = `
                <h2>
                    <span class="status-indicator ${status}"></span>
                    Redis Cache
                </h2>
                <div class="status-details">
                    <p><strong>Status:</strong> ${statusText}</p>
                </div>
            `;

            return card;
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(checkHealth, 30000); // 30 seconds
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }

        // Initial check
        checkHealth();
    </script>
</body>
</html>
